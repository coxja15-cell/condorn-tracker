<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="manifest" href="./manifest.json">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cordon">
  <meta name="theme-color" content="#f2f2f7">

  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">

  <title>Cordon Tracker</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    :root {
      --bg:#eef1f4;
      --surface:rgba(255,255,255,.92);
      --surface-solid:#fff;
      --surface-secondary:rgba(242,242,247,.94);
      --text:#111113;
      --muted:#6e6e73;
      --blue:#007aff;
      --green:#34c759;
      --red:#ff3b30;
      --orange:#ff9500;
      --border:rgba(0,0,0,.10);
      --shadow:0 4px 18px rgba(0,0,0,.15);
      --shadow-heavy:0 10px 35px rgba(0,0,0,.20);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html, body {
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
                  system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      overscroll-behavior:none;
    }

    body {
      position:fixed;
      inset:0;
    }

    button,
    input {
      font:inherit;
    }

    button {
      border:0;
      cursor:pointer;
    }

    input {
      outline:none;
    }

    #map {
      position:fixed;
      inset:0;
      z-index:0;
    }

    /*
      Keep the underlying map light like Apple Maps.
      The app deliberately does not apply a dark/inverted tile filter.
    */
    .leaflet-tile {
      filter:none !important;
    }

    .leaflet-control-attribution {
      background:rgba(255,255,255,.70)!important;
      color:rgba(0,0,0,.45)!important;
      font-size:8px!important;
      border-radius:5px 0 0 0;
    }

    .leaflet-control-attribution a {
      color:rgba(0,0,0,.55)!important;
    }

    .leaflet-control-zoom {
      display:none!important;
    }

    .leaflet-popup-content-wrapper {
      background:rgba(255,255,255,.96)!important;
      color:#111!important;
      border:1px solid var(--border)!important;
      border-radius:15px!important;
      box-shadow:var(--shadow-heavy)!important;
    }

    .leaflet-popup-tip {
      background:rgba(255,255,255,.96)!important;
    }

    .leaflet-popup-content {
      margin:12px 14px!important;
    }

    .ring-label {
      background:rgba(255,255,255,.92)!important;
      border:1px solid rgba(0,0,0,.08)!important;
      border-radius:9px!important;
      box-shadow:0 2px 8px rgba(0,0,0,.14)!important;
      color:#111!important;
      font-size:11px!important;
      font-weight:700!important;
      padding:3px 7px!important;
      text-shadow:none!important;
      white-space:nowrap;
    }

    .ring-label::before {
      display:none!important;
    }

    /* TOP STATUS / APP TITLE */

    #top-status {
      position:fixed;
      top:calc(var(--safe-top) + 10px);
      left:14px;
      right:14px;
      z-index:300;
      display:flex;
      align-items:center;
      justify-content:space-between;
      pointer-events:none;
    }

    #app-title {
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:18px;
      background:rgba(255,255,255,.84);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(22px) saturate(160%);
      -webkit-backdrop-filter:blur(22px) saturate(160%);
      font-size:13px;
      font-weight:700;
      pointer-events:auto;
    }

    #app-title-dot {
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--blue);
      box-shadow:0 0 0 3px rgba(0,122,255,.13);
    }

    #incident-state {
      padding:8px 12px;
      border-radius:18px;
      background:rgba(255,255,255,.84);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(22px) saturate(160%);
      -webkit-backdrop-filter:blur(22px) saturate(160%);
      color:var(--muted);
      font-size:12px;
      font-weight:600;
      pointer-events:auto;
    }

    #incident-state.live {
      color:var(--red);
    }

    /* RIGHT FLOATING CONTROLS */

    #map-controls {
      position:fixed;
      top:calc(var(--safe-top) + 92px);
      right:14px;
      z-index:250;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .map-control {
      width:46px;
      height:46px;
      border-radius:50%;
      background:rgba(255,255,255,.90);
      border:1px solid rgba(0,0,0,.09);
      box-shadow:var(--shadow);
      backdrop-filter:blur(22px) saturate(160%);
      -webkit-backdrop-filter:blur(22px) saturate(160%);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#202124;
      transition:transform .14s ease;
    }

    .map-control:active {
      transform:scale(.90);
    }

    .map-control svg {
      width:21px;
      height:21px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    #fab-share {
      color:var(--blue);
    }

    #fab-loc {
      color:var(--blue);
    }

    #fab-settings {
      color:#333;
    }

    /* SEARCH PILL — BOTTOM, LIKE APPLE MAPS */

    #search-area {
      position:fixed;
      left:14px;
      right:14px;
      bottom:calc(var(--safe-bottom) + 14px);
      z-index:400;
      pointer-events:none;
      transition:bottom .28s cubic-bezier(.32,.72,0,1);
    }

    #search-card {
      width:100%;
      min-height:56px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      border-radius:19px;
      background:rgba(255,255,255,.91);
      border:1px solid rgba(0,0,0,.09);
      box-shadow:var(--shadow-heavy);
      backdrop-filter:blur(26px) saturate(170%);
      -webkit-backdrop-filter:blur(26px) saturate(170%);
      pointer-events:auto;
    }

    #search-icon {
      flex:0 0 auto;
      color:#6e6e73;
      display:flex;
      align-items:center;
    }

    #search-icon svg {
      width:19px;
      height:19px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
    }

    #sinp {
      flex:1;
      min-width:0;
      height:54px;
      border:0;
      background:transparent;
      color:var(--text);
      font-size:17px;
      font-weight:400;
      -webkit-appearance:none;
    }

    #sinp::placeholder {
      color:#6e6e73;
    }

    #sclr {
      display:none;
      width:24px;
      height:24px;
      border-radius:50%;
      background:#8e8e93;
      color:#fff;
      align-items:center;
      justify-content:center;
      font-size:13px;
      font-weight:700;
      flex:0 0 auto;
    }

    #sclr.on {
      display:flex;
    }

    #sres {
      display:none;
      margin-bottom:9px;
      max-height:min(55vh,430px);
      overflow-y:auto;
      border-radius:18px;
      background:rgba(255,255,255,.97);
      border:1px solid rgba(0,0,0,.09);
      box-shadow:var(--shadow-heavy);
      backdrop-filter:blur(26px);
      -webkit-backdrop-filter:blur(26px);
      pointer-events:auto;
      -webkit-overflow-scrolling:touch;
    }

    #sres.open {
      display:block;
    }

    .ri {
      display:flex;
      align-items:center;
      gap:12px;
      min-height:62px;
      padding:10px 14px;
      border-bottom:1px solid rgba(0,0,0,.07);
    }

    .ri:last-child {
      border-bottom:0;
    }

    .ri:active {
      background:#f2f2f7;
    }

    .ri-icon {
      width:36px;
      height:36px;
      border-radius:50%;
      background:#f2f2f7;
      color:var(--blue);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .ri-t {
      min-width:0;
      flex:1;
    }

    .ri-n {
      font-size:15px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .ri-s {
      margin-top:2px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .ri-msg {
      padding:18px 14px;
      text-align:center;
      font-size:14px;
      color:var(--muted);
    }

    /* LOCATION LABEL */

    #olbl {
      position:fixed;
      left:14px;
      bottom:calc(var(--safe-bottom) + 84px);
      z-index:220;
      display:none;
      max-width:calc(100vw - 80px);
      padding:7px 11px;
      border-radius:14px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      color:#111;
      font-size:12px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* INCIDENT SHEET */

    #panel {
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:500;
      max-height:88vh;
      padding-bottom:var(--safe-bottom);
      border-radius:24px 24px 0 0;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 -10px 40px rgba(0,0,0,.18);
      backdrop-filter:blur(30px) saturate(170%);
      -webkit-backdrop-filter:blur(30px) saturate(170%);
      transform:translateY(calc(100% - 76px));
      transition:transform .32s cubic-bezier(.32,.72,0,1);
    }

    #panel.exp {
      transform:translateY(0);
    }

    #panel.hidden {
      display:none;
    }

    .phandle {
      height:34px;
      display:flex;
      justify-content:center;
      align-items:center;
      touch-action:none;
    }

    .pbar {
      width:38px;
      height:5px;
      border-radius:3px;
      background:rgba(60,60,67,.25);
    }

    #pcontent {
      max-height:calc(88vh - 34px);
      overflow:hidden;
    }

    #vcol {
      padding:0 14px 12px;
    }

    #vexp {
      display:none;
      padding:0 14px 18px;
      max-height:calc(88vh - 34px);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }

    /* COMPACT INCIDENT CARD */

    .compact-title {
      display:flex;
      align-items:center;
      gap:9px;
      margin-bottom:10px;
    }

    #compact-icon {
      width:34px;
      height:34px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,122,255,.10);
      color:var(--blue);
      font-size:17px;
    }

    #compact-name {
      flex:1;
      min-width:0;
    }

    #compact-name strong {
      display:block;
      font-size:15px;
      line-height:18px;
    }

    #compact-name span {
      display:block;
      color:var(--muted);
      font-size:12px;
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #compact-status {
      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    .cstats {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:5px;
      margin-bottom:9px;
    }

    .cs {
      min-width:0;
      padding:7px 3px;
      border-radius:10px;
      background:#f2f2f7;
      border:1px solid rgba(0,0,0,.05);
      text-align:center;
    }

    .cs.off {
      opacity:.35;
    }

    .csv {
      font-size:12px;
      line-height:14px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }

    .csl {
      margin-top:2px;
      font-size:8px;
      color:var(--muted);
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .cbtns,
    .ebtns {
      display:flex;
      gap:8px;
    }

    .cb,
    .eb {
      height:48px;
      border-radius:13px;
      font-size:15px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      transition:transform .12s;
    }

    .cb:active,
    .eb:active {
      transform:scale(.96);
    }

    .cb:disabled,
    .eb:disabled {
      opacity:.35;
    }

    .cb-go,
    .eb-go {
      flex:1;
      background:var(--green);
      color:#fff;
    }

    .cb-st,
    .eb-st {
      flex:1;
      background:var(--red);
      color:#fff;
    }

    .cb-sm,
    .eb-sm {
      flex:0 0 48px;
      background:#f2f2f7;
      color:#111;
      border:1px solid rgba(0,0,0,.08);
      font-size:19px;
    }

    /* EXPANDED SHEET */

    .sbar2 {
      display:flex;
      align-items:center;
      gap:9px;
      min-height:42px;
      margin-bottom:12px;
      padding:10px 12px;
      border-radius:12px;
      background:#f2f2f7;
    }

    .sdot {
      width:9px;
      height:9px;
      border-radius:50%;
      background:#8e8e93;
      flex:0 0 auto;
    }

    .sdot.live {
      background:var(--green);
      box-shadow:0 0 0 4px rgba(52,199,89,.14);
      animation:blink 1.4s infinite;
    }

    .sdot.off {
      background:var(--red);
    }

    .stxt2 {
      color:#3a3a3c;
      font-size:13px;
      font-weight:600;
    }

    @keyframes blink {
      0%,100% { opacity:1; }
      50% { opacity:.35; }
    }

    .slbl {
      margin:15px 2px 7px;
      color:#6e6e73;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .type-row {
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding-bottom:2px;
      scrollbar-width:none;
    }

    .type-row::-webkit-scrollbar {
      display:none;
    }

    .type-btn {
      flex:0 0 auto;
      min-width:68px;
      padding:8px 9px;
      border-radius:11px;
      background:#f2f2f7;
      border:1px solid rgba(0,0,0,.07);
      color:#3a3a3c;
      text-align:center;
    }

    .type-btn.active {
      background:rgba(0,122,255,.10);
      border-color:rgba(0,122,255,.40);
      color:var(--blue);
    }

    .type-ico {
      display:block;
      font-size:17px;
      margin-bottom:3px;
    }

    .type-lbl {
      font-size:9px;
      font-weight:700;
      text-transform:uppercase;
    }

    .field,
    .ring-row {
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      margin-bottom:7px;
      border-radius:12px;
      background:#f2f2f7;
      border:1px solid rgba(0,0,0,.06);
    }

    .fi {
      flex:0 0 auto;
      font-size:17px;
    }

    .fn {
      flex:1;
      min-width:0;
      font-size:14px;
      color:#3a3a3c;
    }

    .finp,
    .ring-speed {
      width:70px;
      height:36px;
      padding:0 8px;
      border:1px solid rgba(0,0,0,.12);
      border-radius:9px;
      background:#fff;
      color:#111;
      text-align:center;
      font-size:15px;
      -webkit-appearance:none;
      -moz-appearance:textfield;
    }

    .finp::-webkit-inner-spin-button,
    .finp::-webkit-outer-spin-button,
    .ring-speed::-webkit-inner-spin-button,
    .ring-speed::-webkit-outer-spin-button {
      -webkit-appearance:none;
    }

    .fu,
    .ring-unit {
      color:var(--muted);
      font-size:11px;
      min-width:30px;
    }

    .ring-row.off {
      opacity:.42;
    }

    .ring-dot {
      width:10px;
      height:10px;
      border-radius:50%;
      flex:0 0 auto;
    }

    .ring-name {
      flex:1;
      font-size:14px;
      color:#111;
    }

    .toggle {
      position:relative;
      width:46px;
      height:28px;
      border-radius:14px;
      background:#d1d1d6;
      flex:0 0 auto;
      transition:background .2s;
    }

    .toggle::after {
      content:"";
      position:absolute;
      top:3px;
      left:3px;
      width:22px;
      height:22px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 1px 4px rgba(0,0,0,.20);
      transition:transform .22s cubic-bezier(.34,1.56,.64,1);
    }

    .toggle.on {
      background:var(--green);
    }

    .toggle.on::after {
      transform:translateX(18px);
    }

    .estats {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:5px;
      margin-bottom:10px;
    }

    @media (max-width:390px) {
      .map-control {
        width:44px;
        height:44px;
      }

      .cstats,
      .estats {
        gap:3px;
      }

      .csv {
        font-size:11px;
      }

      .csl {
        font-size:7px;
      }
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="top-status">
  <div id="app-title">
    <span id="app-title-dot"></span>
    <span>Cordon Tracker</span>
  </div>
  <div id="incident-state">No incident</div>
</div>

<div id="map-controls">

  <button class="map-control" id="fab-settings"
          onclick="expandPanel()" aria-label="Incident settings"
          title="Incident settings">
    <svg viewBox="0 0 24 24">
      <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 8.46 15a1.7 1.7 0 0 0-1.56-1.03H6v-2.4h.9A1.7 1.7 0 0 0 8.46 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 12.73 5.2V4h2.4v1.2a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 19.4 10c.16.6.71 1.03 1.33 1.03H22v2.4h-1.27A1.7 1.7 0 0 0 19.4 15Z"/>
    </svg>
  </button>

  <button class="map-control" id="fab-loc"
          onclick="getMyLocation()" aria-label="My location"
          title="My location">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
    </svg>
  </button>

  <button class="map-control" onclick="fitMap()"
          aria-label="Fit cordon" title="Fit cordon">
    <svg viewBox="0 0 24 24">
      <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/>
    </svg>
  </button>

  <button class="map-control" id="fab-share"
          onclick="shareIncident()" aria-label="Share incident"
          title="Share incident">
    <svg viewBox="0 0 24 24">
      <path d="M12 16V3"/>
      <path d="m7 8 5-5 5 5"/>
      <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
    </svg>
  </button>

</div>

<div id="olbl"></div>

<div id="search-area">

  <div id="sres"></div>

  <div id="search-card">
    <span id="search-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="m16 16 4.5 4.5"></path>
      </svg>
    </span>

    <input id="sinp"
           type="text"
           placeholder="Search Location"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false">

    <button id="sclr" onclick="clearSearch()" aria-label="Clear search">×</button>
  </div>

</div>

<div id="panel">

  <div class="phandle" id="ptoggle">
    <div class="pbar"></div>
  </div>

  <div id="pcontent">

    <div id="vcol">

      <div class="compact-title">
        <div id="compact-icon">⌖</div>
        <div id="compact-name">
          <strong id="compact-type">Incident setup</strong>
          <span id="compact-location">Tap the map or search for a location</span>
        </div>

  $('rtog-'+id).className = 'toggle ' + (r.on ? 'on' : '');
  $('rrow-'+id).className = 'ring-row' + (r.on ? '' : ' off');

  ['c','e'].forEach(p => {

    if(el) el.className = 'cs' + (r.on ? '' : ' off');

  if(!r.on && circles[id]) {
    map.removeLayer(circles[id]);

/* =========================================================
   SEARCH
   ========================================================= */

$('sinp').addEventListener('input',function(){
  const q = this.value.trim();

  $('sclr').classList.toggle('on',q.length > 0);
  clearTimeout(searchTimer);

  if(q.length < 2) {
    closeSR();
    return;
  }

  const lq = q.toLowerCase();

  const local = DB
    .filter(r =>
      r[0].toLowerCase().includes(lq) ||
      r[1].toLowerCase().includes(lq)
    )
    .slice(0,6);

  renderSR(local,true);

  searchTimer = setTimeout(() => nominatimSearch(q),450);
});

async function nominatimSearch(q) {
  try {
    const r = await fetch(
      'https://nominatim.openstreetmap.org/search?format=json&limit=6&q='+
      encodeURIComponent(q),
      {headers:{'Accept':'application/json'}}
    );

    if(!r.ok) throw new Error();

    const data = await r.json();
    if(!data || !data.length) return;

    const hits = data.map(it => {
      const p = it.display_name.split(', ');
      return [
        p.slice(0,2).join(', '),
        p.slice(2,5).join(', '),
        parseFloat(it.lat),
        parseFloat(it.lon)
      ];
    });

    renderSR(hits,false);

  } catch(e) {
    console.warn('Address search unavailable:',e);
  }
}

function renderSR(hits,loading) {
  const box = $('sres');
  box.innerHTML = '';

  if(!hits.length && !loading) {
    box.innerHTML =
      '<div class="ri-msg">No results — tap the map to set the incident location</div>';
    box.classList.add('open');
    return;
  }

  if(loading && !hits.length) {
    box.innerHTML = '<div class="ri-msg">Searching…</div>';
    box.classList.add('open');
    return;
  }

  hits.forEach(r => {
    const d = document.createElement('div');
    d.className = 'ri';

    d.innerHTML = `
      <div class="ri-icon">⌖</div>
      <div class="ri-t">
        <div class="ri-n">${escapeHTML(r[0])}</div>
        <div class="ri-s">${escapeHTML(r[1] || '')}</div>
      </div>
    `;

    const pick = () => {
      $('sinp').value = r[0];
      $('sclr').classList.add('on');
      closeSR();

      const ll = L.latLng(r[2],r[3]);
      map.setView(ll,15);
      setOrigin(ll,r[0] + (r[1] ? ', '+r[1] : ''));
    };

    d.addEventListener('click',pick);

    d.addEventListener('touchend',e => {
      e.preventDefault();
      pick();
    });

    box.appendChild(d);
  });

  box.classList.add('open');
}

function closeSR() {
  $('sres').classList.remove('open');
}

function clearSearch() {
  $('sinp').value = '';
  $('sclr').classList.remove('on');
  closeSR();
}

document.addEventListener('touchstart',e => {
  if(!$('search-area').contains(e.target)) closeSR();
},{passive:true});

function makePin(col,glow,sz=20) {
  return L.divIcon({
    html:`
      <div style="

        height:${sz}px;
        background:${col};
        border:3px solid #fff;
        border-radius:50%;
        box-shadow:0 0 0 4px ${glow},0 2px 7px rgba(0,0,0,.28);

    className:'',
    iconSize:[sz,sz],
    iconAnchor:[sz/2,sz/2]
  });
}

function makePulse(col) {
  return L.divIcon({
    html:`
      <div style="position:relative;width:28px;height:28px">
        <div style="
          position:absolute;inset:0;border-radius:50%;
          background:${col};opacity:.20;
          animation:cordon-rip 2s infinite;
        "></div>
        <div style="
          position:absolute;left:7px;top:7px;width:14px;height:14px;
          border-radius:50%;background:#fff;border:4px solid ${col};
          box-shadow:0 1px 4px rgba(0,0,0,.25);
        "></div>
      </div>
      <style>
        @keyframes cordon-rip {
          0%{transform:scale(.8);opacity:.4}
          100%{transform:scale(2.8);opacity:0}
        }
      </style>`,
    className:'',
    iconSize:[28,28],
    iconAnchor:[14,14]
  });
}

function popupHTML() {
  const t = TYPES[currentType];

  return `
    <div style="font-family:-apple-system,BlinkMacSystemFont,sans-serif">
      <div style="font-size:13px;font-weight:700;color:${t.color}">
        ${t.icon} ${t.label.toUpperCase()} INCIDENT
      </div>
      <div style="font-size:12px;color:#6e6e73;margin-top:3px">
        ${escapeHTML(originLabel || $('odisplay').textContent || '')}
      </div>
    </div>`;
}

/* =========================================================
   ORIGIN
   ========================================================= */

async function setOrigin(ll,label) {
  origin = ll;
  originLabel = label || '';

  if(!label || /^-?\d+\.\d+/.test(label)) {
    try {
      const r = await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${ll.lat}&lon=${ll.lng}`,
        {headers:{'Accept':'application/json'}}
      );

      const d = await r.json();

      if(d.display_name) {
        const parts = d.display_name.split(', ');
        label = parts.slice(0,4).join(', ');
        originLabel = label;
      }
    } catch(e) {
      console.warn('Reverse geocoding unavailable:',e);
    }
  }

  const t = TYPES[currentType];

  if(oMark) map.removeLayer(oMark);

  oMark = L.marker(ll,{
    icon:makePin(t.color,t.color+'55',20)
  }).addTo(map);

  oMark.bindPopup(popupHTML());

  $('odisplay').textContent = label || '';
  $('odisplay').style.color = '#111';

  $('compact-location').textContent =
    label || 'Incident location set';

  $('olbl').textContent =
    t.icon + ' ' + (label || '').substring(0,60);

  $('olbl').style.display = 'block';

  $('incident-state').textContent = 'Incident ready';
  $('incident-state').classList.remove('live');

  draw();
  reposition();

  $('stxt').textContent = 'Origin set — ready to track';
}

/* =========================================================
   DRAW CORDON RINGS
   ========================================================= */

function draw() {
  if(!origin) return;

  const delay =
    (parseFloat($('e-delay').value) || 0) * 60;

  const liveS =
    going && startAt
      ? (Date.now()-startAt)/1000
      : 0;

  const total = liveS + delay;

  RINGS.forEach(r => {
    const speed =
      (parseFloat($('rspd-'+r.id).value) || r.speed) * KM;

    const radius = speed * total;

    if(!r.on) {
      if(circles[r.id]) {
        map.removeLayer(circles[r.id]);
        delete circles[r.id];
      }

      ['c','e'].forEach(p => {
        const el = $(p+'-'+r.id);
        if(el) el.querySelector('.csv').textContent = '0 m';
      });

      return;
    }

    if(circles[r.id]) {
      circles[r.id].setLatLng(origin);
      circles[r.id].setRadius(radius);
      circles[r.id].setTooltipContent(r.label+': '+fmt(radius));
    } else {
      const c = L.circle(origin,{
        radius,
        color:r.color,
        fillColor:r.color,
        fillOpacity:.08,
        weight:2,
        dashArray:'6 4'
      }).addTo(map);

      c.bindTooltip(
        r.label+': '+fmt(radius),
        {
          permanent:true,
          direction:'right',
          className:'ring-label',
          offset:[10,0]
        }
      );

      circles[r.id] = c;
    }

    const fv = fmt(radius);

    ['c','e'].forEach(p => {
      const el = $(p+'-'+r.id);
      if(el) el.querySelector('.csv').textContent = fv;
    });
  });
}

/* =========================================================
   TIMER
   ========================================================= */

function startTimer() {
  if(!origin) {
    expandPanel();
    alert('Set an incident location first.');
    return;
  }

  if(going) return;

  going = true;
  startAt = Date.now();

  ticker = setInterval(draw,300);
  draw();

  ['c-go','e-go'].forEach(id => $(id).disabled = true);
  ['c-stop','e-stop'].forEach(id => $(id).disabled = false);

  $('sdot').className = 'sdot live';
  $('stxt').textContent = 'Cordon expanding…';
  $('compact-status').textContent = 'LIVE';
  $('compact-status').style.color = 'var(--red)';
  $('incident-state').textContent = 'Live incident';
  $('incident-state').classList.add('live');
}

function stopTimer() {
  if(!going) return;

  going = false;

  clearInterval(ticker);
  ticker = null;

  ['c-go','e-go'].forEach(id => $(id).disabled = false);
  ['c-stop','e-stop'].forEach(id => $(id).disabled = true);

  $('sdot').className = 'sdot off';
  $('stxt').textContent = 'Paused';
  $('compact-status').textContent = 'Paused';
  $('compact-status').style.color = 'var(--muted)';
  $('incident-state').textContent = 'Incident paused';
  $('incident-state').classList.remove('live');

  draw();
}

function resetTimer() {
  stopTimer();

  startAt = null;

  Object.values(circles).forEach(c => map.removeLayer(c));
  circles = {};

  $('sdot').className = 'sdot';
  $('stxt').textContent = origin
    ? 'Reset — ready'
    : 'Idle — set an incident location';

  $('compact-status').textContent = origin ? 'Ready' : 'Idle';
  $('compact-status').style.color = 'var(--muted)';

  $('incident-state').textContent =
    origin ? 'Incident ready' : 'No incident';

  RINGS.forEach(r => {
    ['c','e'].forEach(p => {
      const el = $(p+'-'+r.id);
      if(el) el.querySelector('.csv').textContent = '0 m';
    });
  });
}

/* =========================================================
   SHARE
   ========================================================= */

async function shareIncident() {
  const t = TYPES[currentType];

  let text = t.icon+' '+t.label+' Incident — Cordon Tracker';
  let url = window.location.href.split('?')[0];

  if(origin) {
    url +=
      `?lat=${origin.lat.toFixed(6)}`+
      `&lon=${origin.lng.toFixed(6)}`+
      `&type=${currentType}`+
      `&delay=${$('e-delay').value}`;

    text += '\n📍 '+(originLabel || 'Unknown location');

    const active = RINGS.filter(r => r.on);

    if(active.length) {
      text += '\n🔴 Active rings: '+
        active.map(r => r.label).join(', ');
    }
  }

  if(navigator.share) {
    try {
      await navigator.share({
        title:'Cordon Tracker',
        text,
        url
      });
    } catch(e) {
      if(e.name !== 'AbortError') console.warn('Share failed:',e);
    }
  } else {
    try {
      await navigator.clipboard.writeText(url);
      alert('Link copied!');
    } catch(e) {
      alert(url);
    }
  }
}

/* =========================================================
   RESTORE SHARED INCIDENT
   ========================================================= */

(() => {
  const p = new URLSearchParams(window.location.search);

  const lat = parseFloat(p.get('lat'));
  const lon = parseFloat(p.get('lon'));

  if(Number.isFinite(lat) && Number.isFinite(lon)) {
    const ll = L.latLng(lat,lon);

    if(p.get('type') && TYPES[p.get('type')]) {
      setIncidentType(p.get('type'));
    }

    if(p.get('delay')) {
      $('e-delay').value = p.get('delay');
    }

    map.setView(ll,14);
    setOrigin(ll,'Shared incident location');
  }
})();

/* =========================================================
   MY LOCATION
   ========================================================= */

function getMyLocation() {
  const btn = $('fab-loc');

  btn.style.opacity = '.55';

  if(!navigator.geolocation) {
    alert('Geolocation is not supported on this device.');
    btn.style.opacity = '1';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.style.opacity = '1';

      const ll = L.latLng(
        pos.coords.latitude,
        pos.coords.longitude
      );

      if(uMark) map.removeLayer(uMark);

      uMark = L.marker(ll,{
        icon:makePulse('#007aff')
      }).addTo(map);

      uMark.bindPopup(
        '<div style="color:#007aff;font-weight:700;font-size:13px">● Your Location</div>'
      );

      map.setView(ll,15);
    },
    err => {
      btn.style.opacity = '1';

      alert(
        'Location unavailable.\n\n' +
        'Check Settings → Privacy & Security → Location Services.'
      );
    },
    {
      enableHighAccuracy:true,
      timeout:12000,
      maximumAge:0
    }
  );
}

/* =========================================================
   MAP CLICK
   ========================================================= */

map.on('click',e => {
  if(going) return;

  closeSR();

  setOrigin(e.latlng,null);

  $('sinp').value = '';
  $('sclr').classList.remove('on');
});

/* =========================================================
   FIT MAP
   ========================================================= */

function fitMap() {
  const active = Object.values(circles);

  if(active.length) {
    map.fitBounds(
      L.featureGroup(active).getBounds().pad(.12)
    );
  } else if(origin) {
    map.setView(origin,14);
  } else {
    map.setView([-36.8485,174.7633],13);
  }
}

/* =========================================================
   PANEL
   ========================================================= */

const PANEL = $('panel');
const PTOG = $('ptoggle');
const PCONTENT = $('pcontent');

function expandPanel() {
  panelExp = true;
  PANEL.classList.add('exp');
  $('vcol').style.display = 'none';
  $('vexp').style.display = 'block';
  reposition();
}

function collapsePanel() {
  panelExp = false;
  PANEL.classList.remove('exp');
  $('vexp').style.display = 'none';
  $('vcol').style.display = 'block';
  reposition();
}

PTOG.addEventListener('click',() => {
  if(panelExp) collapsePanel();
  else expandPanel();
});

/* Swipe the sheet */

let dragStartY = 0;
let dragCurY = 0;
let dragging = false;

PTOG.addEventListener('touchstart',e => {
  dragging = true;
  dragStartY = dragCurY = e.touches[0].clientY;
  PANEL.style.transition = 'none';
},{passive:true});

PTOG.addEventListener('touchmove',e => {
  if(!dragging) return;

  dragCurY = e.touches[0].clientY;

  const dy = dragCurY-dragStartY;

  if(panelExp && dy < 0) return;
  if(!panelExp && dy > 0) return;

  PANEL.style.transform =
    panelExp
      ? `translateY(${Math.max(0,dy)}px)`
      : `translateY(calc(100% - 76px + ${Math.min(0,dy)}px))`;
},{passive:true});

PTOG.addEventListener('touchend',() => {
  if(!dragging) return;

  dragging = false;
  PANEL.style.transition = '';

  const dy = dragCurY-dragStartY;

  if(!panelExp && dy < -25) {
    expandPanel();
  } else if(panelExp && dy > 25) {
    collapsePanel();
  } else {
    PANEL.style.transform = '';
  }
});

/* =========================================================
   POSITIONING
   ========================================================= */

function reposition() {
  requestAnimationFrame(() => {
    const panelVisible = panelExp || origin;
    const panelOffset =
      panelVisible ? 88 : 0;

    $('search-area').style.bottom =
      `calc(var(--safe-bottom) + ${14+panelOffset}px)`;

    $('olbl').style.bottom =
      `calc(var(--safe-bottom) + ${84+panelOffset}px)`;
  });
}

window.addEventListener('resize',reposition);
window.addEventListener('orientationchange',() => {
  setTimeout(reposition,250);
});

if(window.visualViewport) {
  window.visualViewport.addEventListener('resize',reposition);
}

/* =========================================================
   DELAY
   ========================================================= */

$('e-delay').addEventListener('input',() => {
  if(origin) draw();
});

/* =========================================================
   INITIAL UI
   ========================================================= */

collapsePanel();
reposition();

/* =========================================================
   SERVICE WORKER
   ========================================================= */

if('serviceWorker' in navigator) {
  window.addEventListener('load',async() => {
    try {
      await navigator.serviceWorker.register(
        './service-worker.js',
        {scope:'./'}
      );
    } catch(error) {
      console.error('Service worker registration failed:',error);
    }
  });
}
</script>
