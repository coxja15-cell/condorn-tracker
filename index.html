<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="./manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cordon">
  <meta name="theme-color" content="#060d18">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Cordon Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root{
      --bg:#060d18;--sur:rgba(6,13,24,.95);--s2:rgba(11,24,38,.97);
      --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
      --text:#f0f4ff;--muted:#607080;
      --acc:#ffb020;--acc2:#ff8c00;
      --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    input,textarea{-webkit-user-select:text;user-select:text}

    /* MAP */
    #map{position:fixed;inset:0;z-index:0}
    .leaflet-tile{filter:brightness(.68) saturate(.45) hue-rotate(190deg) invert(.88)}
    .leaflet-control-zoom{border:1px solid var(--border2)!important;border-radius:12px!important;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.5)!important}
    .leaflet-control-zoom a{background:rgba(6,13,24,.95)!important;color:var(--text)!important;border-bottom:1px solid var(--border)!important}
    .leaflet-control-attribution{background:rgba(0,0,0,.4)!important;color:rgba(255,255,255,.3)!important;font-size:9px!important}
    .leaflet-popup-content-wrapper{background:rgba(6,13,24,.97)!important;color:var(--text)!important;border:1px solid var(--border2)!important;border-radius:14px!important;box-shadow:0 8px 32px rgba(0,0,0,.7)!important;font-family:inherit!important}
    .leaflet-popup-tip{background:rgba(6,13,24,.97)!important}
    .ring-label{background:transparent!important;border:none!important;box-shadow:none!important;color:var(--text);font-size:11px;font-weight:700;font-family:-apple-system,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
    .ring-label::before{display:none!important}

    /* TOP BAR */
    #top-bar{position:fixed;top:calc(var(--safe-top) + 10px);left:12px;right:12px;z-index:200}
    #search-card{background:var(--sur);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.6);overflow:hidden}
    .brand{display:flex;align-items:center;gap:9px;padding:9px 14px 8px;border-bottom:1px solid var(--border)}
    .brand-ico{width:26px;height:26px;background:var(--acc);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:background .3s}
    .brand-name{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .brand-type{margin-left:auto;font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.05em;transition:color .3s}
    .srow{display:flex;align-items:center;padding:10px 14px;gap:10px}
    .sico{color:var(--muted);font-size:15px;flex-shrink:0}
    #sinp{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit;-webkit-appearance:none}
    #sinp::placeholder{color:var(--muted)}
    #sclr{display:none;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:22px;height:22px;color:var(--muted);font-size:11px;cursor:pointer;flex-shrink:0;align-items:center;justify-content:center}
    #sclr.on{display:flex}

    /* RESULTS */
    #sres{display:none;margin-top:5px;background:var(--s2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.7);max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #sres.open{display:block}
    .ri{display:flex;align-items:center;padding:11px 14px;gap:12px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-user-select:none;user-select:none}
    .ri:last-child{border-bottom:none}
    .ri:active{background:rgba(255,255,255,.05)}
    .ri-icon{width:32px;height:32px;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
    .ri-t{flex:1;min-width:0}
    .ri-n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ri-s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ri-msg{padding:14px;font-size:13px;color:var(--muted);text-align:center}

    /* FABS */
    #fabs{position:fixed;right:12px;z-index:150;display:flex;flex-direction:column;gap:8px;transition:bottom .3s cubic-bezier(.32,.72,0,1)}
    .fab{width:46px;height:46px;background:var(--sur);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.5);-webkit-user-select:none;user-select:none;transition:transform .15s}
    .fab:active{transform:scale(.91)}
    .fab-share{background:rgba(255,176,32,.15);border-color:rgba(255,176,32,.3)}

    /* ORIGIN LABEL */
    #olbl{position:fixed;left:12px;z-index:150;background:var(--sur);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:10px;padding:6px 11px;font-size:12px;color:var(--muted);display:none;max-width:calc(100vw - 80px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:bottom .3s cubic-bezier(.32,.72,0,1)}

    /* PANEL */
    #panel{position:fixed;left:0;right:0;bottom:0;z-index:160;background:var(--s2);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--border2);border-radius:22px 22px 0 0;box-shadow:0 -4px 40px rgba(0,0,0,.5);padding-bottom:var(--safe-bot);transition:transform .3s cubic-bezier(.32,.72,0,1)}
    #panel.dragging{transition:none}
    .phandle{display:flex;justify-content:center;padding:10px 0 4px;cursor:pointer;touch-action:none}
    .pbar{width:38px;height:4px;background:rgba(255,255,255,.18);border-radius:2px}

    /* CONTENT MORPH WRAPPER */
    #pcontent{position:relative;overflow:hidden;transition:height .32s cubic-bezier(.32,.72,0,1)}

    /* COLLAPSED */
    #vcol{padding:4px 14px 12px;transition:opacity .22s ease}
    .cstats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
    .cs{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:7px 4px;text-align:center}
    .cs.off{opacity:.3}
    .csv{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:3px;letter-spacing:-.01em}
    .csl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .cbtns{display:flex;gap:8px}
    .cb{height:50px;border-radius:13px;border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .12s;-webkit-user-select:none;user-select:none}
    .cb:active{transform:scale(.95)} .cb:disabled{opacity:.3}
    .cb-go{flex:1;background:#00c853;color:#000}
    .cb-st{flex:1;background:#ef4444;color:#fff}
    .cb-sm{flex:0 0 50px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border2)!important;font-size:18px}

    /* EXPANDED */
    #vexp{display:none;padding:0 14px 14px;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:opacity .22s ease}

    .slbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:14px 0 8px}
    .slbl:first-child{margin-top:0}

    /* INCIDENT TYPE BUTTONS */
    .type-row{display:flex;gap:6px;flex-wrap:wrap}
    .type-btn{flex:1;min-width:0;padding:9px 4px;border-radius:10px;border:1px solid var(--border2);background:rgba(255,255,255,.04);cursor:pointer;text-align:center;transition:all .15s;-webkit-user-select:none;user-select:none}
    .type-btn:active{transform:scale(.95)}
    .type-btn.active{border-color:var(--acc);background:rgba(255,176,32,.12)}
    .type-ico{font-size:18px;display:block;margin-bottom:3px}
    .type-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

    /* RING ROWS */
    .ring-row{display:flex;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:6px;gap:10px}
    .ring-row.off{opacity:.45}
    .ring-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .ring-name{flex:1;font-size:14px}
    .ring-speed{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 8px;color:var(--text);font-size:15px;font-family:'SF Mono','Courier New',monospace;width:64px;text-align:center;outline:none;-webkit-appearance:none;-moz-appearance:textfield}
    .ring-speed::-webkit-outer-spin-button,.ring-speed::-webkit-inner-spin-button{-webkit-appearance:none}
    .ring-unit{font-size:11px;color:var(--muted);min-width:26px}
    .toggle{width:44px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .2s;-webkit-user-select:none;user-select:none}
    .toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 4px rgba(0,0,0,.3)}
    .toggle.on::after{transform:translateX(18px)}
    .toggle.on{background:#00c853}
    .toggle.off{background:rgba(255,255,255,.2)}

    /* FIELDS */
    .field{display:flex;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:6px;gap:10px}
    .fi{font-size:18px;flex-shrink:0}
    .fn{flex:1;font-size:14px}
    .finp{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:7px 10px;color:var(--text);font-size:16px;font-family:'SF Mono','Courier New',monospace;width:76px;text-align:center;outline:none;-webkit-appearance:none;-moz-appearance:textfield}
    .finp::-webkit-outer-spin-button,.finp::-webkit-inner-spin-button{-webkit-appearance:none}
    .fu{font-size:12px;color:var(--muted);min-width:32px}

    /* STATUS */
    .sbar2{display:flex;align-items:center;gap:8px;padding:9px 11px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;margin-bottom:10px}
    .sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .sdot.live{background:#00ff88;box-shadow:0 0 8px rgba(0,255,136,.5);animation:blink 1.4s infinite}
    .sdot.off{background:#ef4444}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
    .stxt2{font-size:13px;color:var(--muted)}

    /* EXP STATS */
    .estats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
    .ebtns{display:flex;gap:8px}
    .eb{flex:1;height:52px;border-radius:13px;border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .12s;-webkit-user-select:none;user-select:none}
    .eb:active{transform:scale(.95)} .eb:disabled{opacity:.3}
    .eb-go{background:#00c853;color:#000}
    .eb-st{background:#ef4444;color:#fff}
    .eb-sm{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border2)!important;flex:0 0 52px;font-size:20px}
  </style>
</head>
<body>
<div id="map"></div>

<!-- TOP SEARCH -->
<div id="top-bar">
  <div id="search-card">
    <div class="brand">
      <div class="brand-ico" id="brand-ico">🚨</div>
      <span class="brand-name">Cordon Tracker</span>
      <span class="brand-type" id="brand-type">General</span>
    </div>
    <div class="srow">
      <span class="sico">🔍</span>
      <input id="sinp" type="text" placeholder="Search address, suburb or landmark…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button id="sclr" onclick="clearSearch()">✕</button>
    </div>
  </div>
  <div id="sres"></div>
</div>

<!-- FABS -->
<div id="fabs">
  <button class="fab fab-share" onclick="shareIncident()" title="Share">📤</button>
  <button class="fab" id="fab-loc" onclick="getMyLocation()" title="My Location">📍</button>
  <button class="fab" onclick="fitMap()" title="Fit view">⊡</button>
</div>

<!-- ORIGIN LABEL -->
<div id="olbl"></div>

<!-- PANEL -->
<div id="panel">
  <div class="phandle" id="ptoggle"><div class="pbar"></div></div>

  <div id="pcontent">
  <!-- COLLAPSED -->
  <div id="vcol">
    <div class="cstats" id="c-stats-row"></div>
    <div class="cbtns">
      <button class="cb cb-go" id="c-go" onclick="startTimer()">▶ Start</button>
      <button class="cb cb-st" id="c-stop" onclick="stopTimer()" disabled>⏹ Stop</button>
      <button class="cb cb-sm" onclick="resetTimer()">↺</button>
      <button class="cb cb-sm" onclick="expandPanel()">⚙</button>
    </div>
  </div>

  <!-- EXPANDED -->
  <div id="vexp">
    <div class="sbar2"><div class="sdot" id="sdot"></div><span class="stxt2" id="stxt">Idle — set an incident location</span></div>

    <div class="slbl">Incident Type</div>
    <div class="type-row" id="type-row"></div>

    <div class="slbl">Incident Location</div>
    <div class="field">
      <span class="fi">📍</span>
      <span class="fn" id="odisplay" style="color:var(--muted);font-size:13px">Not set — search above or tap map</span>
    </div>

    <div class="slbl">Incident Started</div>
    <div class="field">
      <span class="fi">⏱</span><span class="fn">Minutes ago</span>
      <input class="finp" type="number" id="e-delay" value="0" min="0" max="999" step="1"/>
      <span class="fu">min</span>
    </div>

    <div class="slbl">Cordon Rings</div>
    <div id="ring-rows"></div>

    <div class="slbl">Live Data</div>
    <div class="estats" id="e-stats-row"></div>

    <div class="ebtns">
      <button class="eb eb-go" id="e-go" onclick="startTimer()">▶ Start</button>
      <button class="eb eb-st" id="e-stop" onclick="stopTimer()" disabled>⏹ Stop</button>
      <button class="eb eb-sm" onclick="resetTimer()">↺</button>
      <button class="eb eb-sm" onclick="collapsePanel()">▾</button>
    </div>
  </div>
  </div>
</div>

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let origin=null,oMark=null,uMark=null;
let startAt=null,going=false,ticker=null;
let panelExp=false,searchTimer=null;
const KM=1000/3600;
const $=id=>document.getElementById(id);
const fmt=m=>m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m';
const fmtT=s=>{const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss};

// Incident type buttons

Object.entries(TYPES).forEach(([key,t])=>{
  const btn=document.createElement('button');
  btn.className='type-btn'+(key===currentType?' active':'');

// Ring rows in expanded panel

// Stat boxes (collapsed + expanded)
function buildStats(containerId){

buildStats('e-stats-row');

// ═══════════════════════════════════════

// ═══════════════════════════════════════
function setIncidentType(key){
  currentType=key;
  const t=TYPES[key];
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===key));
  document.documentElement.style.setProperty('--acc',t.color);
  $('brand-ico').textContent=t.icon;
  $('brand-ico').style.background=t.color;
  $('brand-type').textContent=t.label;
  // Update origin pin colour
  if(origin&&oMark){
    map.removeLayer(oMark);
    oMark=L.marker(origin,{icon:makePin(t.color,t.color+'66',18)})
      .addTo(map).bindPopup(popupHTML());
  }
}

// ═══════════════════════════════════════
//  RING TOGGLE
// ═══════════════════════════════════════
function toggleRing(id){
  const r=RINGS.find(x=>x.id===id);
  r.on=!r.on;
  $('rtog-'+id).className='toggle '+(r.on?'on':'off');
  $('rrow-'+id).className='ring-row'+(r.on?'':' off');
  // Update stat boxes
  ['c','e'].forEach(p=>{
    const el=$(p+'-'+id);
    if(el) el.className='cs'+(r.on?'':' off');
  });
  // Remove circle if turning off
  if(!r.on && circles[id]){
    map.removeLayer(circles[id]);
    delete circles[id];
  }
  if(origin) draw();
}

// ═══════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════
$('sinp').addEventListener('input',function(){
  const q=this.value.trim();
  $('sclr').classList.toggle('on',q.length>0);
  clearTimeout(searchTimer);
  if(q.length<2){closeSR();return}
  // Show local matches instantly
  const lq=q.toLowerCase();
  const local=DB.filter(r=>r[0].toLowerCase().includes(lq)||r[1].toLowerCase().includes(lq)).slice(0,5);
  renderSR(local,true);
  // Then fetch real results
  searchTimer=setTimeout(()=>nominatimSearch(q),450);
});

async function nominatimSearch(q){
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&q='+encodeURIComponent(q));
    if(!r.ok)throw new Error();
    const data=await r.json();
    if(!data||!data.length) return; // keep local results
    const hits=data.map(it=>{
      const p=it.display_name.split(', ');
      return [p.slice(0,2).join(', '),p.slice(2,5).join(', '),parseFloat(it.lat),parseFloat(it.lon)];
    });
    renderSR(hits,false);
  }catch(e){}
}

function renderSR(hits,loading){
  const box=$('sres');
  box.innerHTML='';
  if(!hits.length&&!loading){
    box.innerHTML='<div class="ri-msg">No results — tap map to set location</div>';
    box.classList.add('open');return;
  }
  if(loading&&!hits.length){
    box.innerHTML='<div class="ri-msg">Searching…</div>';
    box.classList.add('open');return;
  }
  hits.forEach(r=>{
    const d=document.createElement('div');
    d.className='ri';
    d.innerHTML=`<div class="ri-icon">${TYPES[currentType].icon}</div><div class="ri-t"><div class="ri-n">${r[0]}</div><div class="ri-s">${r[1]}</div></div>`;
    const pick=()=>{
      $('sinp').value=r[0]; $('sclr').classList.add('on');
      closeSR();
      const ll=L.latLng(r[2],r[3]);
      map.setView(ll,15);
      setOrigin(ll,r[0]+(r[1]?', '+r[1]:''));
    };
    d.addEventListener('click',pick);
    d.addEventListener('touchend',e=>{e.preventDefault();pick()});
    box.appendChild(d);
  });
  box.classList.add('open');
}

function closeSR(){$('sres').classList.remove('open')}
function clearSearch(){$('sinp').value='';$('sclr').classList.remove('on');closeSR()}
document.addEventListener('touchstart',e=>{if(!$('top-bar').contains(e.target))closeSR()},{passive:true});

// ═══════════════════════════════════════
//  PINS
// ═══════════════════════════════════════
function makePin(col,glow,sz=16){
  return L.divIcon({
    html:`<div style="width:${sz}px;height:${sz}px;background:${col};border:2.5px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 0 3px ${glow},0 3px 10px rgba(0,0,0,.5)"></div>`,
    className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]
  });
}

function makePulse(col){
  return L.divIcon({
    html:`<div style="position:relative;width:20px;height:20px"><div style="position:absolute;inset:0;border-radius:50%;background:${col};opacity:.25;animation:rip 2s infinite"></div><div style="position:absolute;inset:4px;border-radius:50%;background:${col};border:2px solid rgba(255,255,255,.85)"></div></div><style>@keyframes rip{0%{transform:scale(1);opacity:.3}100%{transform:scale(3);opacity:0}}</style>`,
    className:'',iconSize:[20,20],iconAnchor:[10,10]
  });
}

function popupHTML(){
  const t=TYPES[currentType];
  return `<div style="font-family:inherit;padding:2px"><div style="font-weight:700;font-size:13px;color:${t.color}">${t.icon} ${t.label.toUpperCase()} INCIDENT</div><div style="font-size:12px;color:#a0b0c0;margin-top:3px">${$('odisplay').textContent||''}</div></div>`;
}

// ═══════════════════════════════════════
//  ORIGIN
// ═══════════════════════════════════════
async function setOrigin(ll,label){
  origin=ll;
  // Try reverse geocode if label is coordinates
  if(!label || /^-?\d+\.\d+/.test(label)){
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${ll.lat}&lon=${ll.lng}`);
      const d=await r.json();
      if(d.display_name){
        const parts=d.display_name.split(', ');
        label=parts.slice(0,4).join(', ');
      }
    }catch(e){}
  }

  const t=TYPES[currentType];
  if(oMark)map.removeLayer(oMark);
  oMark=L.marker(ll,{icon:makePin(t.color,t.color+'66',18)}).addTo(map);
  $('odisplay').textContent=label||'';
  $('odisplay').style.color='var(--text)';
  const ol=$('olbl');
  ol.textContent=t.icon+' '+(label||'').substring(0,50);
  ol.style.display='block';
  // Update popup after display set
  oMark.bindPopup(popupHTML());
  draw();
  reposition();
  $('stxt').textContent='Origin set — ready to track';
}

// ═══════════════════════════════════════
//  DRAW RINGS
// ═══════════════════════════════════════
function draw(){
  if(!origin)return;
  const delay=(parseFloat($('e-delay').value)||0)*60;
  const liveS=going?(Date.now()-startAt)/1000:0;
  const total=liveS+delay;

  RINGS.forEach(r=>{
    const speed=(parseFloat($('rspd-'+r.id).value)||r.speed)*KM;
    const radius=speed*total;

    if(!r.on){
      if(circles[r.id]){map.removeLayer(circles[r.id]);delete circles[r.id]}
      return;
    }

    if(circles[r.id]){
      circles[r.id].setLatLng(origin);
      circles[r.id].setRadius(radius);
      circles[r.id].setTooltipContent(r.label+': '+fmt(radius));
    } else {
      const c=L.circle(origin,{
        radius,color:r.color,fillColor:r.color,fillOpacity:.07,weight:2,dashArray:'6 4'
      }).addTo(map);
      c.bindTooltip(r.label+': '+fmt(radius),{
        permanent:true,direction:'right',className:'ring-label',offset:[10,0]
      });
      circles[r.id]=c;
    }

    // Update stat displays
    const fv=fmt(radius);
    ['c','e'].forEach(p=>{
      const el=$(p+'-'+r.id);
      if(el) el.querySelector('.csv').textContent=fv;
    });
  });
}

// ═══════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════
function startTimer(){
  if(!origin){alert('Set an incident location first.');return}
  if(going)return;
  going=true;startAt=Date.now();
  ticker=setInterval(draw,300);draw();
  ['c-go','e-go'].forEach(id=>{$(id).disabled=true});
  ['c-stop','e-stop'].forEach(id=>{$(id).disabled=false});
  $('sdot').className='sdot live';
  $('stxt').textContent='Cordon expanding…';
}

function stopTimer(){
  if(!going)return;
  going=false;clearInterval(ticker);
  ['c-go','e-go'].forEach(id=>{$(id).disabled=false});
  ['c-stop','e-stop'].forEach(id=>{$(id).disabled=true});
  $('sdot').className='sdot off';
  $('stxt').textContent='Paused';
  draw();
}

function resetTimer(){
  stopTimer();startAt=null;
  Object.values(circles).forEach(c=>map.removeLayer(c));
  circles={};
  $('sdot').className='sdot';
  $('stxt').textContent='Reset — ready';
  RINGS.forEach(r=>{
    ['c','e'].forEach(p=>{
      const el=$(p+'-'+r.id);
      if(el)el.querySelector('.csv').textContent='0 m';
    });
  });
}

// ═══════════════════════════════════════
//  SHARE
// ═══════════════════════════════════════
function shareIncident(){
  const t=TYPES[currentType];
  let text=t.icon+' '+t.label+' Incident — Cordon Tracker';
  let url=window.location.href.split('?')[0];
  if(origin){
    url+=`?lat=${origin.lat.toFixed(6)}&lon=${origin.lng.toFixed(6)}&type=${currentType}&delay=${$('e-delay').value}`;
    text+='\n📍 '+($('odisplay').textContent||'Unknown location');
    const active=RINGS.filter(r=>r.on);
    if(active.length) text+='\n🔴 Active rings: '+active.map(r=>r.label).join(', ');
  }
  if(navigator.share){
    navigator.share({title:'Cordon Tracker',text,url}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>alert('Link copied!')).catch(()=>alert(url));
  }
}

// Restore from URL params
(()=>{
  const p=new URLSearchParams(window.location.search);
  if(p.get('lat')&&p.get('lon')){
    const ll=L.latLng(parseFloat(p.get('lat')),parseFloat(p.get('lon')));
    if(p.get('type')&&TYPES[p.get('type')])setIncidentType(p.get('type'));
    if(p.get('delay'))$('e-delay').value=p.get('delay');
    map.setView(ll,14);
    setOrigin(ll,'Shared incident location');
  }
})();

// ═══════════════════════════════════════
//  MY LOCATION
// ═══════════════════════════════════════
function getMyLocation(){
  const btn=$('fab-loc');btn.textContent='⏳';
  if(!navigator.geolocation){alert('Geolocation not supported.');btn.textContent='📍';return}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      btn.textContent='📍';
      const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);
      if(uMark)map.removeLayer(uMark);
      uMark=L.marker(ll,{icon:makePulse('#00ff88')})
        .addTo(map).bindPopup('<div style="color:#00ff88;font-weight:700;font-size:13px">● Your Location</div>');
      map.setView(ll,15);
    },
    err=>{btn.textContent='📍';alert('Location denied.\nSettings → Privacy → Location Services → Safari');},
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}

// ═══════════════════════════════════════
//  MAP CLICK — reverse geocode on HTTPS
// ═══════════════════════════════════════
map.on('click',e=>{
  if(going)return;
  closeSR();
  setOrigin(e.latlng,null); // null triggers reverse geocode
  $('sinp').value='';$('sclr').classList.remove('on');
});

function fitMap(){
  const active=Object.values(circles);
  if(active.length){
    const group=L.featureGroup(active);
    map.fitBounds(group.getBounds().pad(.1));
  } else if(origin) map.setView(origin,14);
}

// ═══════════════════════════════════════
//  PANEL — morph + drag
// ═══════════════════════════════════════
const PANEL=$('panel'),PTOG=$('ptoggle'),PCONTENT=$('pcontent');
let morphTimer=null;

function morph(toExpanded){
  const incoming = toExpanded ? $('vexp') : $('vcol');
  const outgoing = toExpanded ? $('vcol') : $('vexp');
  clearTimeout(morphTimer);

  const fromH = PCONTENT.getBoundingClientRect().height;

  outgoing.style.position='absolute';
  outgoing.style.left='0';
  outgoing.style.right='0';
  outgoing.style.top='0';

  incoming.style.position='static';
  incoming.style.display='block';
  incoming.style.opacity='0';

  void PCONTENT.offsetHeight; // reflow so scrollHeight reflects incoming's natural size
  const toH = PCONTENT.scrollHeight;

  PCONTENT.style.height = fromH+'px';
  void PCONTENT.offsetHeight; // lock in start point before animating

  requestAnimationFrame(()=>{
    PCONTENT.style.height = toH+'px';
    incoming.style.opacity='1';
    outgoing.style.opacity='0';
  });

  reposition();

  morphTimer=setTimeout(()=>{
    outgoing.style.display='none';
    outgoing.style.position='';
    outgoing.style.opacity='';
    incoming.style.position='';
    PCONTENT.style.height='';
    reposition();
  },340);
}

function expandPanel(){if(panelExp)return;panelExp=true;PANEL.classList.add('exp');morph(true)}
function collapsePanel(){if(!panelExp)return;panelExp=false;PANEL.classList.remove('exp');morph(false)}

let dragStartY=0,dragCurY=0,dragging=false,dragT0=0,justDragged=false;

PTOG.addEventListener('touchstart',e=>{
  dragging=true;dragStartY=dragCurY=e.touches[0].clientY;dragT0=Date.now();
  PANEL.classList.add('dragging');
},{passive:true});

PTOG.addEventListener('touchmove',e=>{
  if(!dragging)return;
  dragCurY=e.touches[0].clientY;
  let dy=dragCurY-dragStartY;
  if(panelExp&&dy<0)dy*=.35;   // rubber band past expanded
  if(!panelExp&&dy>0)dy*=.35;  // rubber band past collapsed
  PANEL.style.transform=`translateY(${dy}px)`;
},{passive:true});

PTOG.addEventListener('touchend',()=>{
  if(!dragging)return;
  dragging=false;
  const dy=dragCurY-dragStartY,v=dy/Math.max(Date.now()-dragT0,1);
  PANEL.classList.remove('dragging');
  PANEL.style.transform='';
  if(!panelExp&&(dy<-25||v<-.5))expandPanel();
  else if(panelExp&&(dy>25||v>.5))collapsePanel();
  justDragged=true;setTimeout(()=>justDragged=false,60);
});

PTOG.addEventListener('click',()=>{if(!justDragged)panelExp?collapsePanel():expandPanel()});

function reposition(){
  requestAnimationFrame(()=>{
    const ph=PANEL.getBoundingClientRect().height;
    $('fabs').style.bottom=(ph+12)+'px';
    $('olbl').style.bottom=(ph+12)+'px';
  });
}

window.addEventListener('resize',reposition);
setTimeout(reposition,150);
$('e-delay').addEventListener('input',()=>{if(origin)draw()});
</script>
