<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="manifest" href="./manifest.json">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cordon Tracker">

  <meta name="theme-color" content="#ffffff">

  <title>Cordon Tracker</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg:#eef1f4;
      --surface:rgba(255,255,255,.92);
      --surface-solid:#fff;
      --surface-secondary:rgba(242,242,247,.94);
      --text:#111113;
      --muted:#6e6e73;
      --blue:#007aff;
      --green:#34c759;
      --red:#ff3b30;
      --orange:#ff9500;
      --border:rgba(0,0,0,.10);
      --shadow:0 4px 18px rgba(0,0,0,.15);
      --shadow-heavy:0 10px 35px rgba(0,0,0,.20);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body {
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",
                  "SF Pro Display",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      overscroll-behavior:none;
    }

    body {
      position:fixed;
      inset:0;
    }

    button,
    input {
      font:inherit;
    }

    button {
      border:0;
      cursor:pointer;
    }

    input {
      outline:none;
    }

    #map {
      position:fixed;
      inset:0;
      z-index:0;
    }

    .leaflet-tile {
      filter:none !important;
    }

    .leaflet-control-zoom {
      display:none !important;
    }

    .user-location-marker {
      background:transparent;
      border:0;
    }

    .user-location-marker__halo,
    .user-location-marker__dot {
      position:absolute;
      border-radius:50%;
    }

    .user-location-marker__halo {
      inset:0;
      background:rgba(0,122,255,.24);
      animation:user-location-pulse 1.8s ease-out infinite;
    }

    .user-location-marker__dot {
      inset:7px;
      background:#007aff;
      border:3px solid #fff;
      box-shadow:0 1px 5px rgba(0,0,0,.30);
    }

    @keyframes user-location-pulse {
      0% { transform:scale(.65); opacity:.85; }
      100% { transform:scale(1.35); opacity:0; }
    }

    .leaflet-popup-content-wrapper {
      background:rgba(255,255,255,.96) !important;
      color:#111 !important;
      border:1px solid var(--border) !important;
      border-radius:15px !important;
      box-shadow:var(--shadow-heavy) !important;
    }

    .leaflet-popup-tip {
      background:rgba(255,255,255,.96) !important;
    }

    .leaflet-popup-content {
      margin:12px 14px !important;
    }

    /*
      RING LABELS
      Each ring uses its own bearing so labels don't all appear
      on top of each other at the same point around the circle.
    */

    .ring-label {
      background:rgba(255,255,255,.96) !important;
      border:1px solid rgba(0,0,0,.10) !important;
      border-radius:10px !important;
      box-shadow:0 2px 8px rgba(0,0,0,.16) !important;
      color:#111 !important;
      font-size:11px !important;
      font-weight:800 !important;
      padding:4px 8px !important;
      text-shadow:none !important;
      white-space:nowrap;
    }

    .ring-label::after {
      content:"";
      position:absolute;
      width:5px;
      height:5px;
      border-radius:50%;
      background:currentColor;
      box-shadow:0 0 0 2px rgba(255,255,255,.8);
    }

    .ring-label::before {
      display:none !important;
    }

    /*
      TOP STATUS
    */

    #top-status {
      position:fixed;
      top:calc(var(--safe-top) + 10px);
      left:14px;
      right:14px;
      z-index:300;
      display:flex;
      align-items:center;
      justify-content:space-between;
      pointer-events:none;
    }

    #app-title {
      display:flex;
      align-items:center;
      gap:9px;
      padding:8px 12px;
      border-radius:15px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }

    #app-title-icon {
      width:30px;
      height:30px;
      border-radius:9px;
      background:#111;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
    }

    #app-title-text {
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }

    #app-title-text strong {
      font-size:14px;
      font-weight:800;
    }

    #app-title-text span {
      margin-top:3px;
      font-size:10px;
      color:var(--muted);
      font-weight:600;
    }

    #incident-state {
      padding:8px 11px;
      border-radius:14px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    #incident-state.live {
      color:var(--red);
    }

    /*
      MAP CONTROLS
    */

    #map-controls {
      position:fixed;
      right:14px;
      top:calc(var(--safe-top) + 68px);
      z-index:300;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .map-control {
      width:44px;
      height:44px;
      border-radius:14px;
      background:rgba(255,255,255,.91);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#111;
    }

    .map-control:active {
      transform:scale(.95);
    }

    .map-control svg {
      width:20px;
      height:20px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /*
      QUICK START
    */

    #quick-start {
      position:fixed;
      left:50%;
      bottom:calc(var(--safe-bottom) + 82px);
      transform:translateX(-50%) translateY(15px) scale(.96);
      z-index:450;
      min-height:48px;
      padding:0 18px;
      border-radius:16px;
      background:#111;
      color:#fff;
      box-shadow:var(--shadow-heavy);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-size:14px;
      font-weight:800;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease,
                  transform .2s ease,
                  bottom .28s cubic-bezier(.32,.72,0,1);
      -webkit-tap-highlight-color:transparent;
    }

    #quick-start.visible {
      opacity:1;
      pointer-events:auto;
      transform:translateX(-50%) translateY(0) scale(1);
    }

    #quick-start:active {
      transform:translateX(-50%) scale(.95);
    }

    .qs-icon {
      font-size:13px;
    }

    @media (min-width:700px) {
      #quick-start {
        max-width:230px;
      }
    }

    /*
      SEARCH
      Full-width field directly underneath the tracking controls.
    */

    #search-area {
      position:static;
      width:100%;
      margin-top:12px;
      padding:12px 0 2px;
      border-top:1px solid rgba(0,0,0,.08);
      pointer-events:auto;
    }

    #search-card {
      width:100%;
      min-height:54px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      border-radius:15px;
      background:#f2f2f7;
      border:1px solid rgba(0,0,0,.09);
      box-shadow:none;
      pointer-events:auto;
    }

    #search-icon {
      flex:0 0 auto;
      color:#6e6e73;
      display:flex;
      align-items:center;
    }

    #search-icon svg {
      width:19px;
      height:19px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
    }

    #sinp {
      flex:1;
      min-width:0;
      height:52px;
      border:0;
      background:transparent;
      color:var(--text);
      font-size:17px;
      font-weight:400;
      -webkit-appearance:none;
    }

    #sinp::placeholder {
      color:#6e6e73;
    }

    #sclr {
      display:none;
      width:28px;
      height:28px;
      border-radius:50%;
      background:#8e8e93;
      color:#fff;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:700;
      flex:0 0 auto;
    }

    #sclr.on {
      display:flex;
    }

    #sres {
      display:none;
      margin-top:8px;
      max-height:min(42vh,360px);
      overflow-y:auto;
      border-radius:15px;
      background:rgba(255,255,255,.98);
      border:1px solid rgba(0,0,0,.09);
      box-shadow:var(--shadow);
      pointer-events:auto;
      -webkit-overflow-scrolling:touch;
    }

    #sres.open {
      display:block;
    }

    .ri {
      display:flex;
      align-items:center;
      gap:12px;
      min-height:62px;
      padding:10px 14px;
      border-bottom:1px solid rgba(0,0,0,.07);
    }

    .ri:last-child {
      border-bottom:0;
    }

    .ri:active {
      background:#f2f2f7;
    }

    .ri-icon {
      width:36px;
      height:36px;
      border-radius:50%;
      background:#f2f2f7;
      color:var(--blue);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .ri-t {
      min-width:0;
      flex:1;
    }

    .ri-n {
      font-size:15px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .ri-s {
      margin-top:2px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .ri-msg {
      padding:18px 14px;
      text-align:center;
      font-size:14px;
      color:var(--muted);
    }

    /*
      LOCATION LABEL
    */

    #olbl {
      position:fixed;
      left:14px;
      bottom:calc(var(--safe-bottom) + 84px);
      z-index:220;
      display:none;
      max-width:calc(100vw - 80px);
      padding:7px 11px;
      border-radius:14px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:var(--shadow);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      color:#111;
      font-size:12px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /*
      INCIDENT SHEET
    */

    #panel {
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:500;
      max-height:88vh;
      padding-bottom:var(--safe-bottom);
      border-radius:24px 24px 0 0;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 -10px 40px rgba(0,0,0,.18);
      backdrop-filter:blur(30px) saturate(170%);
      -webkit-backdrop-filter:blur(30px) saturate(170%);
      transform:translateY(calc(100% - 76px));
      transition:transform .32s cubic-bezier(.32,.72,0,1);
    }

    #panel.exp {
      transform:translateY(0);
    }

    #panel.hidden {
      display:none;
    }

    .phandle {
      height:34px;
      display:flex;
      justify-content:center;
      align-items:center;
      touch-action:none;
    }

    .pbar {
      width:38px;
      height:5px;
      border-radius:3px;
      background:rgba(60,60,67,.25);
    }

    #pcontent {
      max-height:calc(88vh - 34px);
      overflow:hidden;
    }

    #vcol {
      padding:0 14px calc(14px + var(--safe-bottom));
    }

    #vexp {
      display:none;
      padding:0 14px 18px;
      max-height:calc(88vh - 34px);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }

    @media (max-width:699px) {
      #panel {
        padding-bottom:max(var(--safe-bottom), 8px);
      }

      #vexp {
        padding-bottom:calc(18px + var(--safe-bottom));
      }
    }

    /*
      COMPACT INCIDENT CARD
    */

    .compact-title {
      display:flex;
      align-items:center;
      gap:9px;
      margin-bottom:10px;
    }

    #compact-icon {
      width:34px;
      height:34px;
      border-radius:10px;
      background:#f2f2f7;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      font-size:17px;
    }

    #compact-name {
      min-width:0;
      flex:1;
      display:flex;
      flex-direction:column;
    }

    #compact-name strong {
      font-size:14px;
      font-weight:800;
      line-height:1.1;
    }

    #compact-location {
      margin-top:3px;
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #compact-status {
      flex:0 0 auto;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
    }

    .cstats,
    .estats {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      margin-bottom:10px;
    }

    .cs {
      min-width:0;
      padding:7px 3px;
      border-radius:10px;
      background:#f2f2f7;
      border:1px solid rgba(0,0,0,.05);
      text-align:center;
    }

    .cs.off {
      opacity:.35;
    }

    .csv {
      font-size:12px;
      line-height:14px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }

    .csl {
      margin-top:2px;
      font-size:8px;
      color:var(--muted);
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    /*
      START / STOP
      Deliberately separated from utility controls.
    */

    .cbtns,
    .ebtns {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .cutils,
    .eutils {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .cb,
    .eb {
      min-height:52px;
      border-radius:13px;
      font-size:16px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      transition:transform .12s;
      touch-action:manipulation;
    }

    .cb:active,
    .eb:active {
      transform:scale(.96);
    }

    .cb:disabled,
    .eb:disabled {
      opacity:.35;
    }

    .cb-go,
    .eb-go {
      background:var(--green);
      color:#fff;
    }

    .cb-st,
    .eb-st {
      background:var(--red);
      color:#fff;
    }

    .cb-sm,
    .eb-sm {
      min-height:48px;
      background:#f2f2f7;
      color:#111;
      border:1px solid rgba(0,0,0,.08);
      font-size:15px;
    }

    /*
      EXPANDED SHEET
    */

    .sbar2 {
      display:flex;
      align-items:center;
      gap:9px;
      min-height:42px;
      margin-bottom:12px;
      padding:10px 12px;
      border-radius:12px;
      background:#f2f2f7;
    }

    .sdot {
      width:9px;
      height:9px;
      border-radius:50%;
      background:#8e8e93;
      flex:0 0 auto;
    }

    .sdot.live {
      background:var(--green);
      box-shadow:0 0 0 4px rgba(52,199,89,.14);
      animation:blink 1.4s infinite;
    }

    .sdot.off {
      background:var(--red);
    }

    .stxt2 {
      color:#3a3a3c;
      font-size:13px;
      font-weight:600;
    }

    @keyframes blink {
      0%,100% {
        opacity:1;
      }

      50% {
        opacity:.35;
      }
    }

    .slbl {
      margin:15px 2px 7px;
      color:#6e6e73;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .type-row {
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding-bottom:2px;
      scrollbar-width:none;
    }

    .type-row::-webkit-scrollbar {
      display:none;
    }

    .type-btn {
      min-width:74px;
      min-height:48px;
      padding:6px 9px;
      border-radius:12px;
      background:#f2f2f7;
      border:1px solid rgba(0,0,0,.06);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      flex:0 0 auto;
      font-size:10px;
      font-weight:700;
      color:#3a3a3c;
    }

    .type-btn.active {
      color:#fff;
      background:#111;
      border-color:#111;
    }

    .type-icon {
      font-size:17px;
      line-height:17px;
    }

    .field {
      min-height:48px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:8px 12px;
      border-radius:12px;
      background:#f2f2f7;
      border:1px solid rgba(0,0,0,.06);
    }

    .fi {
      width:22px;
      flex:0 0 22px;
      text-align:center;
      color:#6e6e73;
      font-size:17px;
    }

    .fn {
      min-width:0;
      flex:1;
      color:#111;
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .finp {
      width:70px;
      height:36px;
      border:1px solid rgba(0,0,0,.10);
      border-radius:9px;
      background:#fff;
      text-align:center;
      font-size:15px;
      font-weight:700;
    }

    .fu {
      color:var(--muted);
      font-size:12px;
      font-weight:600;
    }

    #ring-rows {
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .ring-row {
      min-height:48px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:7px 10px;
      border-radius:12px;
      background:#f2f2f7;
      border:1px solid rgba(0,0,0,.05);
    }

    .ring-toggle {
      width:40px;
      height:32px;
      border-radius:9px;
      background:#d1d1d6;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      font-size:12px;
      font-weight:800;
    }

    .ring-toggle.on {
      background:#111;
    }

    .ring-name {
      min-width:0;
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .ring-name strong {
      font-size:13px;
      font-weight:700;
    }

    .ring-name span {
      margin-top:2px;
      color:var(--muted);
      font-size:10px;
    }

    .ring-value {
      min-width:60px;
      text-align:right;
      font-size:12px;
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }

    /*
      The expanded utility row is intentionally separate from
      Start/Stop so the primary actions remain large and obvious.
    */

    .eutils {
      margin-bottom:4px;
    }

    /*
      GENERAL TOUCH / SAFARI
    */

    button,
    input {
      touch-action:manipulation;
    }

    input[type="number"] {
      -moz-appearance:textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance:none;
      margin:0;
    }
  </style>

  <link rel="stylesheet" href="./cordon-tracker-mobile-cta.css?v=2">
</head>

<body>

<div id="map"></div>

<div id="top-status">
  <div id="app-title">
    <div id="app-title-icon">⌖</div>

    <div id="app-title-text">
      <strong>Cordon Tracker</strong>
      <span>Incident management</span>
    </div>
  </div>

  <div id="incident-state">
    No incident
  </div>
</div>

<div id="map-controls">

  <button class="map-control"
          onclick="locateUser()"
          aria-label="My location"
          title="My location">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
    </svg>
  </button>

  <button class="map-control"
          onclick="fitMap()"
          aria-label="Fit cordon"
          title="Fit cordon">
    <svg viewBox="0 0 24 24">
      <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"></path>
    </svg>
  </button>

  <button class="map-control"
          id="fab-share"
          onclick="shareIncident()"
          aria-label="Share incident"
          title="Share incident">

<script>

/* =========================================================

const TYPES = {

let currentType = 'general';


/* =========================================================
   CORDON RINGS
   ========================================================= */

const RINGS = [
  {
    id:'walk',
    label:'Walk',
    speed:4,
    color:'#8e8e93',
    on:false
  },

  {
    id:'run',

    on:false

];

let circles = {};
let ringLabels = {};

/*
  Give every ring a different bearing so labels don't stack.
*/

const RING_BEARINGS = {
  walk:0,
  run:72,
  cycle:144,
  vehicle:216,
  highway:288
};


/* =========================================================
   NZ SEARCH DATABASE
   ========================================================= */

const DB = [
  ["Kaitaia","Northland",-35.1134,173.2653],
  ["Kerikeri","Bay of Islands",-35.1831,173.9480],
  ["Paihia","Bay of Islands",-35.2794,174.0892],

  ["Albany","Auckland",-36.7245,174.6964],

  ["Newmarket","Auckland",-36.8699,174.7760],

  ["Gisborne","Gisborne",-38.6623,178.0176],

/* =========================================================
   HELPERS
   ========================================================= */

const $ = id => document.getElementById(id);

function fmt(m) {
  if(m < 1000) {
    return Math.round(m)+' m';
  }

  return (m/1000).toFixed(2)+' km';
}


/*
  Destination point.

  Calculates a point a given distance and bearing from a
  latitude/longitude origin.
*/

function destinationPoint(origin, distance, bearing) {

  const R = 6371000;

  const lat1 = origin.lat * Math.PI / 180;
  const lon1 = origin.lng * Math.PI / 180;
  const brng = bearing * Math.PI / 180;

  const lat2 = Math.asin(
    Math.sin(lat1) * Math.cos(distance/R) +
    Math.cos(lat1) *
    Math.sin(distance/R) *
    Math.cos(brng)
  );

  const lon2 =
    lon1 +
    Math.atan2(
      Math.sin(brng) * Math.sin(distance/R) * Math.cos(lat1),
      Math.cos(distance/R) -
      Math.sin(lat1) * Math.sin(lat2)
    );

  return {
    lat:lat2 * 180 / Math.PI,
    lng:lon2 * 180 / Math.PI
  };
}


/* =========================================================
   MAP
   ========================================================= */

const map = L.map('map',{
  zoomControl:false,
  attributionControl:true,
  doubleClickZoom:false
}).setView(
  [-36.8485,174.7633],
  12
);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom:19,
    attribution:'© OpenStreetMap'
  }
).addTo(map);

let origin = null;
let originLabel = '';
let originMarker = null;
let userMarker = null;


/* =========================================================
   DRAW RINGS
   ========================================================= */

function draw() {

  if(!origin) return;

  const incidentStartSeconds =
    Math.max(
      0,
      parseFloat(
        $('e-delay').value
      ) || 0
    ) * 60;

  const liveSeconds =
    going && startAt
      ? (Date.now() - startAt) / 1000
      : 0;

  const elapsed =
    incidentStartSeconds +
    elapsedWhenPaused +
    liveSeconds;

  RINGS.forEach(r => {

    if(!r.on) {

      if(circles[r.id]) {
        map.removeLayer(circles[r.id]);
        delete circles[r.id];
      }

      if(ringLabels[r.id]) {
        map.removeLayer(ringLabels[r.id]);
        delete ringLabels[r.id];
      }

      ['c','e'].forEach(p => {
        const el = $(p+'-'+r.id);

        if(el) {
          el.querySelector('.csv').textContent = '0 m';
        }
      });

      return;
    }

    /*
      Distance = speed × elapsed time.
      Speed is km/h.
    */

    const radius =
      r.speed * 1000 / 3600 * elapsed;

    if(radius <= 0) {

      ['c','e'].forEach(p => {
        const el = $(p+'-'+r.id);

        if(el) {
          el.querySelector('.csv').textContent = '0 m';
        }
      });

      return;
    }

    if(circles[r.id]) {

      circles[r.id].setLatLng(origin);
      circles[r.id].setRadius(radius);

    } else {

      circles[r.id] =
        L.circle(
          origin,
          {
            radius,
            color:r.color,
            fillColor:r.color,
            fillOpacity:.08,
            weight:2,
            dashArray:'6 4'
          }
        ).addTo(map);
    }

    /*
      Labels sit at different points around the rings instead
      of all appearing at 3 o'clock.
    */

    const labelPoint =
      destinationPoint(
        origin,
        Math.max(radius,35),
        RING_BEARINGS[r.id] || 0
      );

    if(ringLabels[r.id]) {

      ringLabels[r.id].setLatLng(labelPoint);

      ringLabels[r.id].setIcon(
        L.divIcon({
          className:'ring-label',
          html:
            `<span style="color:${r.color}">
              ${r.label}: ${fmt(radius)}
            </span>`,
          iconSize:null,
          iconAnchor:[0,0]
        })
      );

    } else {

      ringLabels[r.id] =
        L.marker(
          labelPoint,
          {
            interactive:false,
            keyboard:false,
            zIndexOffset:100
          }
        ).addTo(map);

      ringLabels[r.id].setIcon(
        L.divIcon({
          className:'ring-label',
          html:
            `<span style="color:${r.color}">
              ${r.label}: ${fmt(radius)}
            </span>`,
          iconSize:null,
          iconAnchor:[0,0]
        })
      );
    }

    const fv = fmt(radius);

    ['c','e'].forEach(p => {

      const el = $(p+'-'+r.id);

      if(el) {
        el.querySelector('.csv').textContent = fv;
      }
    });

  });
}


/* =========================================================
   TIMER
   ========================================================= */

let going = false;
let startAt = null;
let elapsedWhenPaused = 0;
let ticker = null;

function updateQuickStart() {

  const btn = $('quick-start');

  if(!btn) return;

  if(origin && !going) {
    btn.classList.add('visible');
  } else {
    btn.classList.remove('visible');
  }
}


function quickStartIncident() {

  if(!origin) {

    expandPanel();

    $('sinp').focus();

    return;
  }

  startTimer();
}


function startTimer() {

  if(!origin) {

    expandPanel();

    alert('Set an incident location first.');

    return;
  }

  if(going) return;

  going = true;

  startAt = Date.now();

  ticker = setInterval(
    draw,
    300
  );

  draw();

  ['c-go','e-go'].forEach(
    id => $(id).disabled = true
  );

  ['c-stop','e-stop'].forEach(
    id => $(id).disabled = false
  );

  $('sdot').className = 'sdot live';

  $('stxt').textContent =
    'Cordon expanding…';

  $('compact-status').textContent =
    'LIVE';

  $('compact-status').style.color =
    'var(--red)';

  $('incident-state').textContent =
    'Live incident';

  $('incident-state').classList.add('live');

  updateQuickStart();
}


function stopTimer() {

  if(!going) return;

  if(startAt) {
    elapsedWhenPaused +=
      (Date.now() - startAt) / 1000;
  }

  startAt = null;
  going = false;

  clearInterval(ticker);

  ticker = null;

  ['c-go','e-go'].forEach(
    id => $(id).disabled = false
  );

  ['c-stop','e-stop'].forEach(
    id => $(id).disabled = true
  );

  $('sdot').className = 'sdot off';

  $('stxt').textContent =
    'Paused';

  $('compact-status').textContent =
    'Paused';

  $('compact-status').style.color =
    'var(--muted)';

  $('incident-state').textContent =
    'Incident paused';

  $('incident-state').classList.remove('live');

  draw();

  updateQuickStart();
}


function resetTimer() {

  stopTimer();

  startAt = null;
  elapsedWhenPaused = 0;

  Object.values(circles).forEach(
    c => map.removeLayer(c)
  );

  circles = {};

  Object.values(ringLabels).forEach(
    l => map.removeLayer(l)
  );

  ringLabels = {};

  $('sdot').className = 'sdot';

  $('stxt').textContent =
    origin
      ? 'Reset — ready'
      : 'Idle — set an incident location';

  $('compact-status').textContent =
    origin
      ? 'Ready'
      : 'Idle';

  $('compact-status').style.color =
    'var(--muted)';

  $('incident-state').textContent =
    origin
      ? 'Incident ready'
      : 'No incident';

  RINGS.forEach(r => {

    ['c','e'].forEach(p => {

      const el = $(p+'-'+r.id);

      if(el) {
        el.querySelector('.csv').textContent =
          '0 m';
      }
    });
  });

  updateQuickStart();
}


/* =========================================================
   SHARE
   ========================================================= */

async function shareIncident() {

  const t = TYPES[currentType];

  let text =
    t.icon +
    ' ' +
    t.label +
    ' Incident — Cordon Tracker';

  let url =
    window.location.href.split('?')[0];

  if(origin) {

    url +=
      `?lat=${origin.lat.toFixed(6)}`+
      `&lon=${origin.lng.toFixed(6)}`+
      `&type=${currentType}`+
      `&delay=${$('e-delay').value}`;

    text +=
      '\n📍 '+
      (originLabel || 'Unknown location');

    const active =
      RINGS.filter(
        r => r.on
      );

    if(active.length) {

      text +=
        '\n🔴 Active rings: '+
        active
          .map(r => r.label)
          .join(', ');
    }
  }

  if(navigator.share) {

    try {

      await navigator.share({
        title:'Cordon Tracker',
        text,
        url
      });

    } catch(e) {

      if(e.name !== 'AbortError') {
        console.warn(
          'Share failed:',
          e
        );
      }
    }

  } else {

    try {

      await navigator.clipboard.writeText(url);

      alert('Link copied!');

    } catch(e) {

      alert(url);
    }
  }
}


/* =========================================================
   RESTORE SHARED INCIDENT
   ========================================================= */

(() => {

  const p =
    new URLSearchParams(
      window.location.search
    );

  const lat =
    parseFloat(
      p.get('lat')
    );

  const lon =
    parseFloat(
      p.get('lon')
    );

  const type =
    p.get('type');

  const delay =
    parseInt(
      p.get('delay') || '0',
      10
    );

  if(
    Number.isFinite(lat) &&
    Number.isFinite(lon)
  ) {

    setOrigin(
      lat,
      lon,
      'Shared incident'
    );

    if(type && TYPES[type]) {

      currentType = type;

      renderTypes();
    }

    $('e-delay').value =
      Number.isFinite(delay)
        ? delay
        : 0;

    draw();
  }

})();


/* =========================================================
   LOCATION
   ========================================================= */

function setOrigin(
  lat,
  lng,
  label
) {

  origin = {
    lat,
    lng
  };

  originLabel =
    label || 'Selected location';

  if(originMarker) {
    map.removeLayer(originMarker);
  }

  originMarker =
    L.marker(
      origin,
      {
        draggable:true
      }
    ).addTo(map);

  originMarker.on(
    'dragend',
    e => {

      const p =
        e.target.getLatLng();

      origin = {
        lat:p.lat,
        lng:p.lng
      };

      originLabel =
        'Selected location';

      updateLocationUI();

      draw();
    }
  );

  map.setView(
    origin,
    Math.max(
      map.getZoom(),
      13
    )
  );

  updateLocationUI();

  draw();

  updateQuickStart();
}


function updateLocationUI() {

  $('compact-location').textContent =
    originLabel ||
    'Tap the map or search for a location';

  $('odisplay').textContent =
    originLabel ||
    'Not set — search above or tap map';

  $('odisplay').style.color =
    origin
      ? 'var(--text)'
      : 'var(--muted)';

  $('incident-state').textContent =
    going
      ? 'Live incident'
      : 'Incident ready';
}


/* =========================================================
   MAP CLICK
   ========================================================= */

map.on(
  'click',
  e => {

    setOrigin(
      e.latlng.lat,
      e.latlng.lng,
      'Map location'
    );
  }
);


/* =========================================================
   USER LOCATION
   ========================================================= */

function locateUser() {

  if(!navigator.geolocation) {

    alert(
      'Location services are not available.'
    );

    return;
  }

  navigator.geolocation.getCurrentPosition(

    pos => {

      const location = [
        pos.coords.latitude,
        pos.coords.longitude
      ];

      const icon =
        L.divIcon({
          className:'user-location-marker',
          html:
            '<span class="user-location-marker__halo"></span>'+
            '<span class="user-location-marker__dot"></span>',
          iconSize:[28,28],
          iconAnchor:[14,14]
        });

      if(userMarker) {

        userMarker.setLatLng(location);

      } else {

        userMarker =
          L.marker(
            location,
            {
              icon,
              title:'Your location',
              zIndexOffset:1000
            }
          ).addTo(map);

        userMarker.bindPopup(
          '<strong>Your location</strong>'
        );
      }

      map.setView(
        location,
        15
      );
    },

    err => {

      console.warn(
        'Location error:',
        err
      );

      alert(
        'Unable to get your location.'
      );
    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:30000
    }
  );
}


/* =========================================================
   FIT MAP
   ========================================================= */

function fitMap() {

  if(!origin) return;

  const layers =
    Object.values(circles);

  if(!layers.length) {

    map.setView(
      origin,
      14
    );

    return;
  }

  const group =
    L.featureGroup(
      layers
    );

  map.fitBounds(
    group.getBounds().pad(.15)
  );
}


/* =========================================================
   INCIDENT TYPES UI
   ========================================================= */

function renderTypes() {

  const row =
    $('type-row');

  if(!row) return;

  row.innerHTML = '';

  Object.entries(TYPES).forEach(
    ([id,t]) => {

      const btn =
        document.createElement(
          'button'
        );

      btn.className =
        'type-btn'+
        (
          id === currentType
            ? ' active'
            : ''
        );

      btn.innerHTML =
        `<span class="type-icon">
          ${t.icon}
        </span>
        <span>${t.label}</span>`;

      btn.onclick = () => {

        currentType = id;

        renderTypes();

        $('compact-type').textContent =
          t.label;

        $('compact-icon').textContent =
          t.icon;
      };

      row.appendChild(btn);
    }
  );

  const t =
    TYPES[currentType];

  $('compact-type').textContent =
    t.label;

  $('compact-icon').textContent =
    t.icon;
}


/* =========================================================
   RING UI
   ========================================================= */

function renderRings() {

  const row =
    $('ring-rows');

  if(!row) return;

  row.innerHTML = '';

  RINGS.forEach(r => {

    const item =
      document.createElement('div');

    item.className =
      'ring-row';

    item.innerHTML =

      `<button class="ring-toggle ${
        r.on ? 'on' : ''
      }"
        aria-label="Toggle ${r.label}">
        ${r.on ? 'ON' : 'OFF'}
      </button>

      <div class="ring-name">
        <strong>${r.label}</strong>
        <span>${r.speed} km/h</span>
      </div>

      <div class="ring-value">
        <span class="csv">0 m</span>
      </div>`;

    const toggle =
      item.querySelector(
        '.ring-toggle'
      );

    toggle.onclick = () => {

      r.on = !r.on;

      toggle.classList.toggle(
        'on',
        r.on
      );

      toggle.textContent =
        r.on
          ? 'ON'
          : 'OFF';

      draw();
    };

    row.appendChild(item);
  });
}


/* =========================================================
   STATS
   ========================================================= */

function renderStats() {

  ['c-stats-row','e-stats-row']
    .forEach(id => {

      const el = $(id);

      if(!el) return;

      el.innerHTML = '';

      RINGS.forEach(r => {

        const stat =
          document.createElement(
            'div'
          );

        stat.className =
          'cs'+
          (
            r.on
              ? ''
              : ' off'
          );

        stat.id =
          `${id[0]}-${r.id}`;

        stat.innerHTML =
          `<div class="csv">0 m</div>
           <div class="csl">${r.label}</div>`;

        el.appendChild(stat);
      });
    });
}


/* =========================================================
   SEARCH
   ========================================================= */

function openSR() {

  $('sres').classList.add(
    'open'
  );
}


function closeSR() {

  $('sres').classList.remove(
    'open'
  );
}


function clearSearch() {

  $('sinp').value = '';

  $('sclr').classList.remove(
    'on'
  );

  $('sres').innerHTML = '';

  closeSR();

  $('sinp').focus();
}


function searchLocations(value) {

  const q =
    value
      .trim()
      .toLowerCase();

  const res =
    $('sres');

  if(!q) {

    res.innerHTML = '';

    closeSR();

    return;
  }

  const matches =
    DB.filter(
      row =>
        row[0]
          .toLowerCase()
          .includes(q) ||
        row[1]
          .toLowerCase()
          .includes(q)
    ).slice(0,8);

  if(!matches.length) {

    res.innerHTML =
      `<div class="ri-msg">
        No matching locations found
      </div>`;

    openSR();

    return;
  }

  res.innerHTML = '';

  matches.forEach(
    row => {

      const item =
        document.createElement(
          'div'
        );

      item.className =
        'ri';

      item.innerHTML =
        `<div class="ri-icon">⌖</div>

         <div class="ri-t">
           <div class="ri-n">
             ${row[0]}
           </div>

           <div class="ri-s">
             ${row[1]}
           </div>
         </div>`;

      item.addEventListener(
        'click',
        () => {

          setOrigin(
            row[2],
            row[3],
            row[0]+
            ', '+
            row[1]
          );

          $('sinp').value =
            row[0];

          $('sclr').classList.add(
            'on'
          );

          closeSR();

          map.setView(
            [row[2],row[3]],
            14
          );
        }
      );

      res.appendChild(item);
    }
  );

  openSR();
}


$('sinp').addEventListener(
  'input',
  e => {

    const value =
      e.target.value;

    if(value.trim()) {

      $('sclr').classList.add(
        'on'
      );

    } else {

      $('sclr').classList.remove(
        'on'
      );
    }

    searchLocations(value);
  }
);


$('sinp').addEventListener(
  'keydown',
  e => {

    if(e.key === 'Escape') {

      clearSearch();
    }
  }
);


/* Keep the selected incident start time in sync with ring distances. */
$('e-delay').addEventListener(
  'input',
  () => {
    if(origin) draw();
  }
);


/* =========================================================
   OUTSIDE SEARCH CLICK
   ========================================================= */

document.addEventListener(
  'click',
  e => {

    if(
      !$('search-area').contains(
        e.target
      )
    ) {

      closeSR();
    }
  }
);


/* =========================================================
   PANEL
   ========================================================= */

const PANEL =
  $('panel');

const PTOG =
  $('ptoggle');

let panelExp = false;
let dragging = false;
let dragStartY = 0;
let dragCurY = 0;


function expandPanel() {

  panelExp = true;

  PANEL.classList.add(
    'exp'
  );

  $('vcol').style.display =
    'none';

  $('vexp').style.display =
    'block';

  renderTypes();
  renderRings();
  renderStats();

  setTimeout(
    () => map.invalidateSize(),
    350
  );
}


function collapsePanel() {

  panelExp = false;

  PANEL.classList.remove(
    'exp'
  );

  $('vcol').style.display =
    'block';

  $('vexp').style.display =
    'none';

  setTimeout(
    () => map.invalidateSize(),
    350
  );
}


PTOG.addEventListener(
  'touchstart',
  e => {

    dragging = true;

    dragStartY =
      e.touches[0].clientY;

    dragCurY =
      dragStartY;

    PANEL.style.transition =
      'none';

  },
  {
    passive:true
  }
);


PTOG.addEventListener(
  'touchmove',
  e => {

    if(!dragging) return;

    dragCurY =
      e.touches[0].clientY;

    const dy =
      dragCurY -
      dragStartY;

    if(
      panelExp &&
      dy < 0
    ) return;

    if(
      !panelExp &&
      dy > 0
    ) return;

    PANEL.style.transform =
      panelExp
        ? `translateY(${Math.max(0,dy)}px)`
        : `translateY(calc(100% - 76px + ${Math.min(0,dy)}px))`;

  },
  {
    passive:true
  }
);


PTOG.addEventListener(
  'touchend',
  () => {

    if(!dragging) return;

    dragging = false;

    PANEL.style.transition =
      '';

    const dy =
      dragCurY -
      dragStartY;

    if(
      !panelExp &&
      dy < -25
    ) {

      expandPanel();

    } else if(
      panelExp &&
      dy > 25
    ) {

      collapsePanel();

    } else {

      PANEL.style.transform =
        '';
    }
  }
);


/* =========================================================
   POSITIONING
   ========================================================= */

function reposition() {

  requestAnimationFrame(
    () => {

      const panelVisible =
        panelExp || origin;

      const panelOffset =
        panelVisible
          ? 88
          : 0;

      const searchArea =
        $('search-area');

      if(searchArea) {
        searchArea.style.bottom =
          '';
      }

      $('olbl').style.bottom =
        `calc(var(--safe-bottom) + ${
          84 + panelOffset
        }px)`;

      $('quick-start').style.bottom =
        `calc(var(--safe-bottom) + ${
          82 + panelOffset
        }px)`;
    }
  );
}


window.addEventListener(
  'resize',
  reposition
);

window.addEventListener(
  'orientationchange',
  () => {

    setTimeout(
      reposition,
      250
    );
  }
);


if(window.visualViewport) {

  window.visualViewport.addEventListener(
    'resize',
    reposition
  );
}


/* =========================================================
   INITIALISE
   ========================================================= */

renderTypes();
renderRings();
renderStats();

reposition();

updateQuickStart();

</script>

</body>
</html>
